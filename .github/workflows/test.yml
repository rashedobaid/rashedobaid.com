---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test build and wrangler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: true
      - uses: jdx/mise-action@v4
      - name: Build site
        run: hugo --minify --printI18nWarnings --printPathWarnings
      - name: Test wrangler CLI
        run: wrangler --version
